.logo{width:76px;height:76px;border-radius:22px;background:var(--pr);display:grid;place-items:center;font-size:40px;margin:0 auto 10px}
.mi{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--bd);cursor:pointer}.mi span:first-child{width:28px}.mi b{flex:1;font-weight:600}

<div id="app"></div><div id="sh"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);

const pl=p=>MN[+p.slice(5)-1]+' '+p.slice(0,4),fd=d=>+d.slice(8)+' '+MN[+d.slice(5,7)-1]+' '+d.slice(0,4);

const SL={paid:'Ada Shuda',pending:'Intezaar',late:'Late'},ROLES=['Malik','Manager','Staff'],TYPES=['House','Portion','Flat','Villa','Farm House'],UNITS=['Marla','Kanal','Sq Yd','Sq Ft'];
const RQ=['Bedroom','Bathroom','Kitchen','Drawing Room','Lounge','Store','Servant Quarter','Garage','Terrace','Lawn'],FQ=['Gas','Bijli','Pani','Boring','AC','Geyser','Parking','Lawn','Generator','Solar','Internet','CCTV','Lift','Furnished'];
const METH=['Naqd','Bank Transfer','JazzCash','Easypaisa'],OWNDOCS=['Registry','Fard / Intiqal','Allotment Letter','Lease / Ijaaza','Power of Attorney','Dusra'];
function seed(){const H=[['Ghar 14-A','Karachi','Gulshan-e-Iqbal','House',5,'Marla',2,3,2,45000],['Ghar 221','Lahore','DHA Phase 5','House',1,'Kanal',2,5,4,180000],['Ghar 7-B','Islamabad','G-13','Portion',7,'Marla',1,2,2,60000],['Ghar 56','Rawalpindi','Bahria Town','House',10,'Marla',2,4,3,95000],['Ghar 18','Faisalabad','Madina Town','House',5,'Marla',2,3,2,35000],['Ghar 3-C','Multan','Gulgasht','Portion',3,'Marla',1,2,1,28000],['Ghar 90','Lahore','Johar Town','House',8,'Marla',2,4,3,85000],['Ghar 12','Peshawar','Hayatabad','House',10,'Marla',2,5,3,70000]],houses=[],tenants=[],pays=[];let pid=1;
 H.forEach((r,i)=>houses.push({id:'h'+i,name:r[0],country:'Pakistan',city:r[1],area:r[2],address:r[2]+', '+r[1],type:r[3],size:r[4],unit:r[5],floors:r[6],rent:r[9],adv:r[9]*2,feat:['Gas','Bijli','Pani'].concat(i%2?['Parking']:[],i%3?['AC']:[]),rooms:[{t:'Bedroom',n:r[7]},{t:'Bathroom',n:r[8]},{t:'Kitchen',n:1},{t:'Drawing Room',n:1},{t:'Lounge',n:1}]}));
 ['Ahmed Khan','Fatima Noor','Usman Tariq','Ayesha Siddiqui','Bilal Hussain','Hina Malik','Kamran Shah'].forEach((n,i)=>{tenants.push({id:'t'+i,name:n,phone:'03'+(21+i)+'-'+(1234567+i*91113),cnic:'35202-'+(1234567+i*7)+'-'+(i+1),house:'h'+i,in:'2026-01-01',active:i<6});
  for(let m=5;m<=(i<6?10:7);m++)pays.push({id:'p'+pid++,tid:'t'+i,period:'2026-'+String(m).padStart(2,'0'),amt:H[i][9],date:'2026-'+String(m).padStart(2,'0')+'-'+String(1+(i*4+m)%27).padStart(2,'0'),st:m==10&&i<6?(i%3==1?'pending':i%4==2?'late':'paid'):'paid',method:METH[i%4]})});
 return{cfg:{countries:{Pakistan:{cur:'Rs',cities:['Karachi','Lahore','Islamabad','Rawalpindi','Faisalabad','Multan','Peshawar','Quetta','Hyderabad','Sialkot']}}},users:[{id:'u1',name:'Ali Raza',phone:'0300-1234567',email:'ali@gharmate.pk',role:'Malik',country:'Pakistan',city:'Lahore'}],cu:'u1',houses,tenants,pays,exp:[],cmp:[],rem:[]}}
const ADMIN='nazimmustafa911@gmail.com',emptyWS=()=>({houses:[],tenants:[],pays:[],exp:[],cmp:[],rem:[]});
let ROOT,SES='',WS='',D;
try{ROOT=JSON.parse(localStorage.getItem('gharmate2'))}catch(e){}
if(!ROOT||!ROOT.users){let o=null;try{o=JSON.parse(localStorage.getItem('gharmate'))}catch(e){}ROOT={cfg:(o&&o.cfg)||seed().cfg,users:[],ws:{},legacy:o&&o.houses?{houses:o.houses,tenants:o.tenants||[],pays:o.pays||[],exp:o.exp||[],cmp:o.cmp||[],rem:o.rem||[]}:null}}
try{SES=localStorage.getItem('gm_ses')||''}catch(e){}
const blk=u=>u.block=='perm'?'Aap ka account hamesha ke liye block hai':u.block&&u.until>Date.now()?'Aap ka account '+new Date(u.until).toLocaleDateString('en-GB')+' tak block hai':'';
const loadWS=()=>{const w=WS?(ROOT.ws[WS]=ROOT.ws[WS]||emptyWS()):emptyWS();D={cfg:ROOT.cfg,users:ROOT.users,cu:SES,houses:w.houses,tenants:w.tenants,pays:w.pays,exp:w.exp,cmp:w.cmp,rem:w.rem}};
{const u=ROOT.users.find(x=>x.id==SES);if(!u||blk(u))SES=''}WS=SES;loadWS();
const save=()=>{if(WS)ROOT.ws[WS]={houses:D.houses,tenants:D.tenants,pays:D.pays,exp:D.exp,cmp:D.cmp,rem:D.rem};ROOT.cfg=D.cfg;ROOT.users=D.users;if(DBC.url)push();try{localStorage.setItem('gharmate2',JSON.stringify(ROOT))}catch(e){toast('Storage bhar gaya — chhoti tasveer use karein')}};
const S={s:'home',hist:[],hf:'all',hc:'',hq:'',tf:'all',tq:'',pf:'all',pq:'',hid:null,rp:CUR};let FD={};
const HS=id=>D.houses.find(h=>h.id==id),T=id=>D.tenants.find(t=>t.id==id)||{name:'?',house:''},occ=h=>D.tenants.find(t=>t.house==h.id&&t.active),cu=()=>D.users.find(u=>u.id==SES)||{name:'Mehmaan',role:'Guest',country:'Pakistan',city:'-',phone:'',email:''};
const cur=c=>(D.cfg.countries[c]||{cur:''}).cur,money=(n,c)=>cur(c)+' '+Number(n||0).toLocaleString('en-PK'),hc=h=>h?h.country:'',pc=p=>hc(HS(T(p.tid).house)),cap=s=>s[0].toUpperCase()+s.slice(1);
const rn=h=>h.rooms.reduce((a,r)=>a+(+r.n||0),0),bn=(h,t)=>(h.rooms.find(r=>r.t==t)||{n:0}).n;
function toast(m){const t=$('#toast');t.textContent=m;t.className='on';setTimeout(()=>t.className='',2000)}
function sheet(h){if(!SES){S.s='login';R();return}const o=$('.sheet'),y=o?o.scrollTop:0;$('#sh').innerHTML=`<div class="ov" onclick="if(event.target==this)closeS()"><div class="sheet">${h}</div></div>`;if(y)$('.sheet').scrollTop=y}const closeS=()=>$('#sh').innerHTML='';
function go(s,p){S.hist.push(S.s);S.s=s;if(p)Object.assign(S,p);R()}function tab(s){S.hist=[];S.s=s;R()}function back(){S.s=S.hist.pop()||'home';R()}
function av(n,z=44){const h=[...n].reduce((a,c)=>a+c.charCodeAt(0),0)*7%360,i=n.split(' ').map(x=>x[0]).slice(0,2).join('');return`<div class="av" style="width:${z}px;height:${z}px;background:hsl(${h},60%,88%);color:hsl(${h},55%,28%)">${i}</div>`}
const topbar=(t,x='')=>`<div class="top"><button class="ib" onclick="back()">‹</button><h2>${t}</h2>${x}</div>`;
function nav(){const t=(k,i,l)=>`<button class="${S.s==k?'on':''}" onclick="tab('${k}')"><i>${i}</i>${l}</button>`;return`<nav>${t('home','🏠','Home')}${t('houses','🏡','Ghar')}<button class="fab" onclick="go('addpay')">+</button>${t('reports','📊','Reports')}${t('profile','👤','Profile')}</nav>`}
/* generic form helpers (use global FD) */
const inp=(l,k,t='text',ph='',x='')=>`<label>${l}</label><input class="in" type="${t}" ${x} value="${FD[k]??''}" placeholder="${ph}" oninput="FD.${k}=${t=='number'?'+this.value':'this.value'}">`;
const sel=(l,k,o,rr)=>`<label>${l}</label><select class="in" onchange="FD.${k}=this.value;${rr?'FD._r()':''}">${o.map(x=>`<option ${x==FD[k]?'selected':''}>${x}</option>`).join('')}</select>`;
const geoSel=()=>{const cs=D.cfg.countries,ct=(cs[FD.country]||{cities:[]}).cities;if(!ct.includes(FD.city))FD.city=ct[0]||'';return sel('Mulk','country',Object.keys(cs),1)+sel('Shehar','city',ct)};
function splash(){return`<div class="body np" style="display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px"><div class="logo">🏡</div><h1 style="font-size:34px">GharMate</h1><p style="color:var(--mu)">Poore ghar kiraye par dene ka aasaan hisaab</p>
<div style="display:grid;gap:8px;text-align:left;margin:10px 0">${[['🏠','Ghar, kamray aur sahuliyat ka record'],['👥','Kirayedaar aur adaigiyan'],['🌍','Pakistan abhi, baqi mulk jald']].map(x=>`<div class="cd" style="display:flex;gap:12px;align-items:center"><span style="font-size:22px">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>
<button class="btn" onclick="go('login')">Shuru Karein</button></div>`}
function login(){return`<div class="body np" style="display:flex;flex-direction:column;justify-content:center"><div class="logo">🏡</div><h1 style="text-align:center;font-size:30px">GharMate</h1><p style="text-align:center;color:var(--mu);margin-bottom:22px">Apne account mein login karein</p>
<input class="in" id="em" placeholder="Email ya username" value="ali@gharmate.pk"><input class="in" id="pw" type="password" placeholder="Password" value="demo1234"><button class="btn" onclick="doLogin()">Login</button><p style="text-align:center;color:var(--mu);margin:14px">ya</p><button class="btn o" style="color:var(--tx);border-color:var(--bd)" onclick="doLogin()">G&nbsp; Google se jaari rakhein</button></div>`}
function doLogin(){if(!$('#em')||!$('#em').value.trim())return toast('Email ya username likhein');S.hist=[];S.s='home';R()}
const late=()=>D.pays.filter(p=>p.st!='paid');
function payRow(p){const t=T(p.tid),h=HS(t.house);return`<div class="row" onclick="openPay('${p.id}')">${av(t.name)}<div class="fl"><b>${t.name}</b><small>${h?h.name+', '+h.city:'-'}</small><small>${fd(p.date)} · ${p.method}</small></div><div class="rt"><span class="bd ${p.st}">${SL[p.st]}</span><b>${money(p.amt,pc(p))}</b></div></div>`}
function home(){const o=D.houses.filter(occ).length,L=late().length,u=cu();
 const q=[['🏡','Ghar',"tab('houses')"],['👥','Kirayedaar',"go('tenants')"],['💳','Adaigiyan',"go('pays')"],['📊','Reports',"tab('reports')"],['🧩','Services',"go('more')"],['🌍','Shehar',"geo()"],['🧑‍💼',isAdmin()?'Admin Panel':'Mera Account',"users()"],['🔔','Yaad-dahani',"remind()"]];
 return`<div class="body"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div><h2>Assalam o Alaikum, ${u.name.split(' ')[0]} 👋</h2><small style="color:var(--mu)">${u.role} · ${u.city}, ${u.country}</small></div><button class="ib" onclick="remind()">🔔${L?`<sup style="color:var(--rd)">${L}</sup>`:''}</button></div>
 <div class="hero"><div>Kul Ghar<big>${D.houses.length}</big><span class="ch">● ${o} Kiraye par</span><span class="ch">${D.houses.length-o} Khali</span></div><span style="font-size:52px">🏡</span></div>
 <div class="qg">${q.map(x=>`<button onclick="${x[2]}"><span>${x[0]}</span>${x[1]}</button>`).join('')}</div>
 <div class="sh"><b>Is Mahine ki Adaigiyan</b><a onclick="go('pays')">Sab Dekhein</a></div><div class="cd" style="padding:0 12px">${D.pays.filter(p=>p.period==CUR).slice(0,3).map(payRow).join('')||'<p style="padding:16px;color:var(--mu)">Abhi koi adaigi nahi.</p>'}</div></div>`}

function houses(){const tb=(k,l)=>`<button class="${S.hf==k?'on':''}" onclick="S.hf='${k}';R()">${l}</button>`,cs=[...new Set(D.houses.map(h=>h.city))].sort();

function upBill(i){const f=i.files[0];if(!f)return;const r=new FileReader();
 if(f.type.startsWith('image/')){r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.7);toast('Tasveer upload ho rahi hai...');imgUp(d).then(u=>{FD.bill={name:f.name,type:'image/jpeg',data:u||d,remote:!!u};hf()}).catch(()=>{toast('imgbb upload nahi hua — tasveer local mehfooz hui');FD.bill={name:f.name,type:'image/jpeg',data:d};hf()})};im.src=r.result};r.readAsDataURL(f)}
 else if(f.type=='application/pdf'){if(f.size>600000)return toast('PDF 600KB se chhoti honi chahiye');r.onload=()=>{FD.bill={name:f.name,type:f.type,data:r.result};hf()};r.readAsDataURL(f)}else toast('Sirf tasveer ya PDF upload karein')}

function admin(){const U=ROOT.users,W=id=>ROOT.ws[id]||emptyWS(),P=[];U.forEach(u=>W(u.id).houses.forEach(h=>ap(h)=='pending'&&P.push([u,h])));const st=u=>u.role=='Admin'?'<span class="bd active">Admin</span>':blk(u)?`<span class="bd late">${u.block=='perm'?'Block (hamesha)':'Block (aarzi)'}</span>`:'<span class="bd active">Active</span>';
 return`${topbar('Admin Panel')}<div class="body np"><button class="btn o" style="margin-bottom:8px" onclick="openCloud()">☁️ Realtime DB, GitHub aur imgbb Settings</button><div class="sh"><b>⏳ Approval ke muntazir ghar (${P.length})</b></div>${P.map(([u,h])=>`<div class="cd" style="margin-bottom:10px"><b>${h.name}</b> <small>${h.area}, ${h.city}</small><small style="display:block;color:var(--mu)">${h.type} · ${h.size} ${h.unit} · ${rn(h)} kamray · ${money(h.rent,h.country)}</small><small style="display:block;color:var(--mu)">Account: ${u.name} (${u.email}) · ${u.phone}</small><small style="display:block;color:var(--mu)">Malik: ${h.ownName||'-'} · CNIC ${h.ownCnic||'-'} · ${h.ownPhone||'-'} · ${h.ownDoc||''} ${h.ownDocNo||''}</small><small style="display:block;color:var(--mu)">Bijli bill: ${h.billRef||'-'} ${h.billMonth||''}</small>${h.bill?`<button class="btn o" style="margin:8px 0;padding:8px" onclick="admBill('${u.id}','${h.id}')">📄 Bill Dekhein</button>`:''}<div class="g2"><button class="btn" onclick="apv('${u.id}','${h.id}','approved')">Approve</button><button class="btn d" onclick="apv('${u.id}','${h.id}','rejected')">Reject</button></div></div>`).join('')||'<p style="color:var(--mu)">Koi pending ghar nahi.</p>'}<div class="sh"><b>👥 Tamam Accounts (${U.length})</b></div>${U.map(u=>`<div class="cd" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:8px"><b>${u.name}</b>${st(u)}</div><small style="display:block;color:var(--mu)">${u.email} · ${u.phone} · ${u.city}, ${u.country}</small><small style="display:block;color:var(--mu)">${W(u.id).houses.length} ghar · ${W(u.id).tenants.length} kirayedaar · ${W(u.id).pays.length} adaigiyan</small>${blk(u)&&u.block!='perm'?`<small style="color:var(--rd)">${blk(u)}</small>`:''}<div class="g2" style="margin-top:8px"><button class="btn o" style="padding:8px" onclick="viewWs('${u.id}')">Data Kholein / Edit</button>${u.role=='Admin'?'':`<button class="btn o" style="padding:8px" onclick="blockSheet('${u.id}')">Block / Unblock</button>`}</div>${u.role=='Admin'?'':`<button class="btn d" style="margin-top:8px;padding:8px" onclick="delUser2('${u.id}')">Account Delete Karein</button>`}</div>`).join('')}</div>`}
function apv(uid,hid,s){const h=ROOT.ws[uid].houses.find(x=>x.id==hid);if(!h)return;if(s=='rejected'&&!confirm('Is ghar ko reject karein?'))return;h.ap=s;save();toast(s=='approved'?'Ghar approve ho gaya':'Ghar reject ho gaya');R()}
function admBill(uid,hid){const b=ROOT.ws[uid].houses.find(x=>x.id==hid).bill;sheet(`<h3>⚡ Bijli ka Bill</h3>${b.type.startsWith('image')?`<img src="${b.data}" style="width:100%;border-radius:12px">`:`<div class="cd">📄 ${b.name}</div>`}`)}
function viewWs(id){WS=id;loadWS();S.hist=['admin'];S.s='home';R()}
function exitWs(){WS=SES;loadWS();S.hist=[];S.s='admin';R()}
function blockSheet(id){const u=ROOT.users.find(x=>x.id==id);sheet(`<h3>${u.name}</h3><p style="color:var(--mu);margin-bottom:10px">${blk(u)||'Account active hai'}</p><div class="g2"><button class="btn o" onclick="setBlock('${id}',1)">1 din block</button><button class="btn o" onclick="setBlock('${id}',7)">7 din block</button><button class="btn o" onclick="setBlock('${id}',30)">30 din block</button><button class="btn d" onclick="setBlock('${id}',-1)">Hamesha block</button></div><button class="btn" style="margin-top:10px" onclick="setBlock('${id}',0)">Unblock Karein</button>`)}
function setBlock(id,d){const u=ROOT.users.find(x=>x.id==id);if(d==-1){u.block='perm';u.until=0}else if(d>0){u.block='temp';u.until=Date.now()+d*864e5}else{u.block='';u.until=0}save();closeS();toast('Account update ho gaya');R()}
function delUser2(id){const u=ROOT.users.find(x=>x.id==id);if(!confirm(u.name+' ka account aur poora data hamesha ke liye delete karein?'))return;ROOT.users=ROOT.users.filter(x=>x.id!=id);delete ROOT.ws[id];if(DBC.url){fetch(dbu('users/'+id),{method:'DELETE'});fetch(dbu('ws/'+id),{method:'DELETE'})}D.users=ROOT.users;save();toast('Account delete ho gaya');R()}
function loadDemo(){const s=seed();D.houses=s.houses.map(h=>({...h,ap:isAdmin()?'approved':'pending'}));D.tenants=s.tenants;D.pays=s.pays;D.exp=[];D.cmp=[];D.rem=[];save();toast('Demo data load ho gaya');R()}
let DBC={url:'',auth:''},SY='Offline',ES=null,pt=null,pl_=null,lastPush=0;try{DBC=JSON.parse(localStorage.getItem('gm_db'))||DBC}catch(e){}
let GH={o:'',r:'',b:'main',p:'gharmate-data.json',t:''};try{GH=Object.assign(GH,JSON.parse(localStorage.getItem('gm_gh')))}catch(e){}
const dbu=p=>DBC.url+'/gharmate'+(p?'/'+p:'')+'.json'+(DBC.auth?'?auth='+encodeURIComponent(DBC.auth):''),ind=()=>{const e=$('#sy');if(e)e.textContent='☁ '+SY};
const dbW=async(m,p,v)=>{const r=await fetch(dbu(p),{method:m,body:JSON.stringify(v)});if(!r.ok)throw new Error(r.status)};
const usersMap=()=>Object.fromEntries(ROOT.users.map(u=>[u.id,u]));
function norm(r){r=r||{};r.cfg=r.cfg||ROOT.cfg;if(!Array.isArray(r.users))r.users=Object.values(r.users||{});r.ws=r.ws||{};Object.keys(r.ws).forEach(k=>{const w=r.ws[k]||{};['houses','tenants','pays','exp','cmp','rem'].forEach(a=>w[a]=w[a]||[]);w.houses.forEach(h=>{h.feat=h.feat||[];h.rooms=h.rooms||[]});r.ws[k]=w});r.users.forEach(u=>u.until=u.until||0);return r}
async function pushAll(){lastPush=Date.now();await dbW('PUT','',{users:usersMap(),cfg:ROOT.cfg,ws:ROOT.ws,ts:Date.now()})}
function push(){clearTimeout(pt);pt=setTimeout(async()=>{try{SY='Syncing...';ind();lastPush=Date.now();await dbW('PATCH','users',usersMap());await dbW('PUT','cfg',ROOT.cfg);if(WS)await dbW('PUT','ws/'+WS,ROOT.ws[WS]);SY='Synced'}catch(e){SY='Error'}ind()},600)}
async function dbPull(){const r=await fetch(dbu(''));if(!r.ok)throw new Error(r.status);const j=await r.json();if(!j){await pushAll();return}
 const lg=ROOT.legacy;ROOT=norm(j);ROOT.legacy=lg;{const u=ROOT.users.find(x=>x.id==SES);if(!u||blk(u))SES='';if(!SES)WS='';else if(!ROOT.users.some(x=>x.id==WS))WS=SES}loadWS();
 if(['home','houses','house','tenants','pays','reports','admin','profile','dash','exps','cmps','rem','bkp'].includes(S.s)&&!$('.sheet'))R();SY='Synced';ind()}
const onEv=()=>{clearTimeout(pl_);pl_=setTimeout(()=>{if(Date.now()-lastPush>2500)dbPull().catch(()=>{SY='Error';ind()})},400)};
function live(){if(ES)ES.close();ES=null;if(!DBC.url)return;ES=new EventSource(dbu(''));ES.addEventListener('put',onEv);ES.addEventListener('patch',onEv);ES.onerror=()=>{SY='Offline';ind()}}
async function dbConnect(){const u=(FD.dburl||'').trim().replace(/\/+$/,'');if(!u.startsWith('https://'))return toast('Sahi https Database URL likhein');DBC={url:u,auth:(FD.dbauth||'').trim()};try{localStorage.setItem('gm_db',JSON.stringify(DBC))}catch(e){}
 try{SY='Syncing...';const r=await fetch(dbu(''));if(!r.ok)throw new Error(r.status);const j=await r.json();if(j&&confirm('Server par pehle se data hai. OK = server ka data lein (local replace). Cancel = local data server par bhej dein (server overwrite).'))await dbPull();else await pushAll();SY='Synced';live();toast('Realtime Database connect ho gaya')}catch(e){SY='Error';toast('Connect nahi hua: '+e.message+' (URL ya rules check karein)')}R()}
function dbOff(){DBC={url:'',auth:''};try{localStorage.removeItem('gm_db')}catch(e){}if(ES)ES.close();SY='Offline';toast('Disconnect ho gaya');R()}
async function imgUp(d){const k=ROOT.cfg.imgKey;if(!k)return null;const f=new FormData();f.append('image',d.split(',')[1]);const r=await fetch('https://api.imgbb.com/1/upload?key='+encodeURIComponent(k),{method:'POST',body:f}),j=await r.json();if(!j.success)throw new Error('imgbb');return j.data.url}
function saveImg(){ROOT.cfg.imgKey=(FD.img||'').trim();D.cfg=ROOT.cfg;save();toast('imgbb key mehfooz ho gayi')}
function ghSet(){GH={o:(FD.gho||'').trim(),r:(FD.ghr||'').trim(),b:(FD.ghb||'main').trim(),p:(FD.ghp||'gharmate-data.json').trim(),t:(FD.ght||'').trim()};try{localStorage.setItem('gm_gh',JSON.stringify(GH))}catch(e){}toast('GitHub settings mehfooz (sirf is device par)')}
const ghu=()=>`https://api.github.com/repos/${GH.o}/${GH.r}/contents/${GH.p}`,ghh=()=>({Authorization:'Bearer '+GH.t,'X-GitHub-Api-Version':'2022-11-28'});
async function ghSave(){if(!GH.o||!GH.r||!GH.t)return toast('Pehle GitHub settings mehfooz karein');try{toast('GitHub par save ho raha hai...');let sha;const g=await fetch(ghu()+'?ref='+GH.b,{headers:ghh()});if(g.ok)sha=(await g.json()).sha;else if(g.status!=404)throw new Error(g.status);
 const body=JSON.stringify({schema:2,savedAt:new Date().toISOString(),data:ROOT},null,1),r=await fetch(ghu(),{method:'PUT',headers:ghh(),body:JSON.stringify({message:'GharMate backup '+new Date().toISOString(),content:btoa(unescape(encodeURIComponent(body))),branch:GH.b,sha})});if(!r.ok)throw new Error(r.status);toast('GitHub par JSON save ho gaya')}catch(e){toast('GitHub error: '+e.message)}}
async function ghLoad(){if(!GH.o||!GH.r||!GH.t)return toast('Pehle GitHub settings mehfooz karein');try{const r=await fetch(ghu()+'?ref='+GH.b,{headers:{...ghh(),Accept:'application/vnd.github.raw+json'}});if(!r.ok)throw new Error(r.status);const o=await r.json(),d=o.data||o;if(!Array.isArray(d.users)||!d.ws)throw new Error('JSON sahi nahi');
 if(!confirm(`GitHub JSON: ${d.users.length} accounts. Mojooda data replace hoga. Jaari rakhein?`))return;try{localStorage.setItem('gharmate_recovery',JSON.stringify(ROOT))}catch(e){}const lg=ROOT.legacy;ROOT=norm(d);ROOT.legacy=lg;if(!ROOT.users.some(x=>x.id==SES))SES='';WS=SES;loadWS();D.cfg=ROOT.cfg;save();toast('GitHub se data load ho gaya');R()}catch(e){toast('GitHub error: '+e.message)}}
function openCloud(){FD={dburl:DBC.url,dbauth:DBC.auth,img:ROOT.cfg.imgKey||'',gho:GH.o,ghr:GH.r,ghb:GH.b,ghp:GH.p,ght:GH.t};FD._r=()=>{};go('cloud')}
function cloud(){return`${topbar('Cloud aur Storage')}<div class="body np"><div class="sh"><b>⚡ Realtime Database (${SY})</b></div><div class="cd">${inp('Database URL','dburl','url','https://xxxx-default-rtdb.firebaseio.com')}${inp('Access key (zaroori nahi)','dbauth','password')}<button class="btn" onclick="dbConnect()">Save aur Connect</button><div class="g2" style="margin-top:8px"><button class="btn o" onclick="push()">Abhi Push</button><button class="btn d" onclick="dbOff()">Disconnect</button></div></div>
 <div class="sh"><b>🖼 imgbb API Key</b></div><div class="cd">${inp('imgbb API key','img','password')}<button class="btn" onclick="saveImg()">Key Mehfooz Karein</button></div>
 <div class="sh"><b>🐙 GitHub JSON</b></div><div class="cd">${inp('Owner / Username','gho')}${inp('Repository','ghr')}${inp('Branch','ghb')}${inp('File path','ghp')}${inp('Token (sirf is device par)','ght','password')}<button class="btn" onclick="ghSet()">Settings Mehfooz Karein</button><div class="g2" style="margin-top:8px"><button class="btn o" onclick="ghSave()">JSON Save</button><button class="btn o" onclick="ghLoad()">JSON Load</button></div></div>
 <p style="color:var(--mu);font-size:12px;margin-top:10px">imgbb key Realtime Database ke zariye sab users ko milti hai taake wo bill upload kar saken. GitHub token sirf is device par rehta hai. GitHub repo private rakhein.</p></div>`}
if(DBC.url){dbPull().catch(()=>{SY='Offline';ind()});live()}
const FN={splash,login,register,admin,cloud,home,houses,house,tenants,pays,addpay,reports,profile,more,dash,exps,expform,cmps,cmpform,rem,bkp};
function R(){if(SES){const u=ROOT.users.find(x=>x.id==SES);if(!u||blk(u)){toast(u?blk(u):'Account maujood nahi');logout();return}}
if(!SES&&!['home','login','register'].includes(S.s)){S.s='login';toast('Aage barhne ke liye pehle login karein')}
if(['admin','cloud'].includes(S.s)&&!isAdmin())S.s='home';
const h=FN[S.s]();if(!h)return;$('#app').innerHTML=`<div class="phone">${WS&&WS!=SES?`<div style="background:#b45309;color:#fff;padding:6px 12px;font-size:12px;display:flex;justify-content:space-between"><span>👁 Admin mode: ${(ROOT.users.find(u=>u.id==WS)||{}).name} ka data</span><a onclick="exitWs()" style="font-weight:800;cursor:pointer">Wapas ›</a></div>`:''}${DBC.url?`<div id="sy" style="font-size:11px;text-align:center;color:var(--mu);padding:2px">☁ ${SY}</div>`:''}${h}${['home','houses','reports','profile'].includes(S.s)?nav():''}</div>`}
R();
</script></body></html>
